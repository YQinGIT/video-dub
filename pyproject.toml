[project]
name = "videodub"
version = "0.1.0"
description = "Local-first, modular video localization toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

# NOTE: the [gpu] optional-dependency extra (torch cu128, faster-whisper, demucs) is
#       added in Stage 7, together with the PyTorch CUDA index configuration.
# NOTE: the `videodub` console script entry point is added in Stage 6 with the CLI.

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videodub"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA; skipped when no GPU is available",
]
