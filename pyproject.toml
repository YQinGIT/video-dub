[project]
name = "videodub"
version = "0.1.0"
description = "Local-first, modular video localization toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
videodub = "videodub.cli:main"

[project.optional-dependencies]
# GPU stack — CUDA box only; `uv sync --extra gpu` adds these on top of core.
# Grown stage by stage: faster-whisper + whisperx + torch land at Stage 7a
# (torch's wheel also supplies the cuBLAS/cuDNN runtime that CTranslate2 needs);
# demucs at 7b; funasr (Paraformer-zh, a Mandarin-specialist ASR backend) added
# afterwards. The Stage 7c TTS backend (IndexTTS-2) has no pip wheel and runs in
# its own isolated venv, installed manually per its module docstring, so it is
# deliberately absent here. torch / torchaudio use the CUDA 12.8 build
# (Blackwell sm_120) via the explicit index below.
gpu = [
    "torch>=2.7",
    "faster-whisper>=1.1",
    "whisperx>=3.4",
    "demucs>=4.0",
    "funasr>=1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videodub"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer's API puts `typer.Option(...)` / `typer.Argument(...)` calls in
# parameter defaults by design; that is not the B008 mutable-default trap.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA; skipped when no GPU is available",
]
